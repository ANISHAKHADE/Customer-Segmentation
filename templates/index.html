<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Customer Segmentation</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 40px;
            display: flex;
            justify-content: center;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            width: 100%;
            max-width: 450px;
        }
        h2 { text-align: center; color: #333; margin-bottom: 24px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 6px; font-weight: 600; color: #555; }
        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover { background-color: #0056b3; }
        #result-box {
            margin-top: 25px;
            padding: 15px;
            border-radius: 6px;
            text-align: center;
            font-weight: bold;
            display: none;
        }
        .Champions { background-color: #fff3cd; color: #856404; border: 1px solid #ffeeba; }
        .New-Promising { background-color: #d1ecf1; color: #0c5460; border: 1px solid #bee5eb; }
        .At-Risk { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    </style>
</head>
<body>

<div class="container">
    <h2>AI Customer Profiler</h2>
    <form id="rfmForm">
        <div class="form-group">
            <label for="recency">Recency (Days since last purchase):</label>
            <input type="number" id="recency" required placeholder="e.g. 5">
        </div>
        <div class="form-group">
            <label for="frequency">Frequency (Total total orders):</label>
            <input type="number" id="frequency" required placeholder="e.g. 15">
        </div>
        <div class="form-group">
            <label for="monetary">Monetary Value ($ Total spent):</label>
            <input type="number" step="0.01" id="monetary" required placeholder="e.g. 12500">
        </div>
        <button type="submit">Predict Segment</button>
    </form>

    <div id="result-box"></div>
</div>

<script>
    document.getElementById('rfmForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const recency = document.getElementById('recency').value;
        const frequency = document.getElementById('frequency').value;
        const monetary = document.getElementById('monetary').value;
        const resultBox = document.getElementById('result-box');

        try {
            // Call your Flask API route asynchronously
            const response = await fetch(`/predict?recency=${recency}&frequency=${frequency}&monetary=${monetary}`);
            const data = await response.json();

            if (data.status === 'success') {
                const label = data.ml_output.segment_label;
                
                // Format name cleanly to fit CSS classes (remove slashes)
                const cssClass = label.replace('/', '-'); 
                
                resultBox.className = cssClass;
                resultBox.style.display = 'block';
                resultBox.innerHTML = `Assigned Segment: ${label} (Cluster ${data.ml_output.cluster_id})`;
            } else {
                alert("API Error: " + data.message);
            }
        } catch (err) {
            console.error(err);
            alert("Could not reach the AI microservice.");
        }
    });
</script>

</body>
</html>
